{% extends "base.html" %}
{% block content %}
  <article class="post">
    <p class="meta">
      <a href="/">← Posts</a>
      <time datetime="{{ post.date.isoformat() }}">{{ post.date.strftime("%B %d, %Y") }}</time>
    </p>
    <h1>{{ post.title }}</h1>
    {{ post.body | safe }}
  </article>
{% endblock %}
